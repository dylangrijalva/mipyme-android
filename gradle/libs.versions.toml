[versions]
agp = "9.3.1"
coreKtx = "1.18.0"
coreSplashscreen = "1.0.0"
junit = "4.13.2"
androidxTest = "1.5.0"
lifecycleRuntimeKtx = "2.10.0"
lifecycleProcess = "2.10.0"
mockk = "1.14.9"
robolectric = "4.16"
roborazzi = "1.63.0"
activityCompose = "1.12.4"
exifInterface = "1.4.2"
kotlin = "2.2.10"
composeBom = "2026.04.01"
koinNav3 = "4.2.0-RC1"
nav3Core = "1.0.1"
lifecycleViewmodelNav3 = "2.10.0"
room = "2.8.4"
paging = "3.5.0"
koin = "4.1.1"
kotlinSerialization = "2.3.10"
kotlinxSerializationCore = "1.10.0"
ktor="3.0.1"
timber= "5.0.1"
arrowCore = "2.2.1.1"
desugarJdkLibs = "2.0.4"
